[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[project]
name="tauros-problem-agent"
version="0.1.0"
description="Migliora il problema prima della soluzione"
readme="README.md"
requires-python=">=3.11"
dependencies=[]

[project.optional-dependencies]
api=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1"]
dev=["pytest>=8,<9","ruff>=0.8,<1"]

[project.scripts]
tauros-problem="tauros_problem_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages=["src/tauros_problem_agent"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
