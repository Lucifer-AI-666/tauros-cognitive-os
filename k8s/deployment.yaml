apiVersion: apps/v1
kind: Deployment
metadata:
  name: tauros
  labels:
    app: tauros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tauros
  template:
    metadata:
      labels:
        app: tauros
    spec:
      containers:
        - name: tauros
          image: tauros-cognitive-os:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TAUROS_NAME
              value: TAUROS
            - name: TAUROS_HOST
              value: "0.0.0.0"
            - name: TAUROS_PORT
              value: "8000"
            - name: TAUROS_ALLOW_LAN_BIND
              value: "true"
            - name: TAUROS_ALLOW_PUBLIC_BIND
              value: "false"
            - name: TAUROS_PROVIDER
              value: vertex
            - name: TAUROS_MODEL
              value: gemini-2.5-flash
            - name: TAUROS_VERTEX_LOCATION
              value: europe-west1
            - name: TAUROS_SECURITY_MODE
              value: locked
            - name: TAUROS_DATABASE_PATH
              value: /app/data/tauros.db
            - name: TAUROS_BACKUP_DIR
              value: /app/data/backups
            - name: TAUROS_CORS_ORIGINS
              value: "null,http://127.0.0.1:8000,http://localhost:8000"
            - name: TAUROS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tauros-api
                  key: token
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tauros
  labels:
    app: tauros
spec:
  type: ClusterIP
  selector:
    app: tauros
  ports:
    - name: http
      port: 8000
      targetPort: http
