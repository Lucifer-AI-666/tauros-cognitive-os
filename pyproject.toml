[project]
name = "tauros-cognitive-os"
version = "0.4.5"
description = "Sistema Operativo Cognitivo Personale, local-first, hardened"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "google-auth[requests]>=2.29,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
tauros = "tauros.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tauros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
