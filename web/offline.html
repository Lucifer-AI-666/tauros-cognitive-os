<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1016" />
  <title>TAUROS · Offline</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#07090c; color:#e8eef7;
      font:16px system-ui,sans-serif; }
    .box { max-width:28rem; padding:2rem; border:1px solid #243041; border-radius:16px; background:#10151d; text-align:center; }
    h1 { font-size:1.25rem; margin:0 0 .5rem; }
    p { color:#8b9bb0; line-height:1.5; }
    button { margin-top:1rem; border:0; border-radius:10px; padding:.7rem 1rem; font-weight:700;
      background:linear-gradient(180deg,#e0b35a,#b8872f); color:#1a1206; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>TAUROS offline</h1>
    <p>La shell dell’app è disponibile, ma l’API non risponde. Controlla la connessione o il server.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
